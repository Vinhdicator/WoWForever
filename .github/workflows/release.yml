name: Release

on:
  push:
    tags: ["**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and release with BigWigs packager
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail -g classic -g classic_era
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and add these secrets to publish to CurseForge/Wago:
          # CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
