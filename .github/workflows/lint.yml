name: Lint Lua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run Luacheck
        # Enforced on errors (exit code 2+): the WoW API surface is provided via
        # wow_api_globals.lua, so genuine problems (typos, undefined vars,
        # invalid escapes, syntax errors) fail the build. Warnings (exit 1) are
        # reported in the log but do not fail. Codes: 0=ok 1=warnings 2=errors
        # 3=critical.
        run: |
          luacheck Necrosis --config .luacheckrc --no-color; code=$?
          echo "luacheck exit code: $code"
          if [ "$code" -ge 2 ]; then exit "$code"; fi

  stylua:
    name: StyLua (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install StyLua
        run: |
          curl -L -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip stylua.zip
          chmod +x stylua
          sudo mv stylua /usr/local/bin/

      - name: Check formatting
        # continue-on-error: the codebase predates StyLua and has formatting
        # drift. Report the diff without failing the build.
        continue-on-error: true
        run: stylua --check Necrosis
