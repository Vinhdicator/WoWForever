name: Release

on:
  push:
    tags: ["**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and release with BigWigs packager
        uses: BigWigsMods/packager@v2
        # Runs at the repo/checkout root (where .git and .pkgmeta live).
        # .pkgmeta uses move-folders to bring the Necrosis/ subfolder up to the
        # package root so the per-flavor .toc files are found and every
        # supported game version is auto-detected (no -g flags).
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and add these secrets to publish to CurseForge/Wago:
          # CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
