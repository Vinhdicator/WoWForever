name: Lint Lua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run Luacheck
        # Enforced: the WoW API surface is provided via wow_api_globals.lua,
        # so only genuine problems (typos, undefined vars, unused locals) fail.
        run: luacheck Necrosis --config .luacheckrc --no-color

  stylua:
    name: StyLua (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install StyLua
        run: |
          curl -L -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip stylua.zip
          chmod +x stylua
          sudo mv stylua /usr/local/bin/

      - name: Check formatting
        # continue-on-error: the codebase predates StyLua and has formatting
        # drift. Report the diff without failing the build.
        continue-on-error: true
        run: stylua --check Necrosis
