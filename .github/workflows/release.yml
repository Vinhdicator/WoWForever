name: Release

on:
  push:
    tags: ["**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and release with BigWigs packager
        uses: BigWigsMods/packager@v2
        with:
          # -t points release.sh's topdir at the Necrosis/ subfolder, where the
          # .toc files actually live (repo root only holds project scaffolding).
          # No -g flags: the per-flavor .toc files (Necrosis.toc,
          # Necrosis_Vanilla.toc, _TBC, _Wrath, _Cata, _MOP, retail) let the
          # packager auto-detect every supported game version.
          args: -t Necrosis
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and add these secrets to publish to CurseForge/Wago:
          # CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
