name: Lint Lua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run Luacheck
        # continue-on-error: the addon references the WoW API (GameTooltip,
        # CreateFrame, etc.) which is only defined inside the game client, so
        # a stock Luacheck reports thousands of "undefined variable" warnings.
        # We surface the report without failing the build.
        continue-on-error: true
        run: luacheck Necrosis --config .luacheckrc --no-color

  stylua:
    name: StyLua (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install StyLua
        run: |
          curl -L -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip stylua.zip
          chmod +x stylua
          sudo mv stylua /usr/local/bin/

      - name: Check formatting
        # continue-on-error: the codebase predates StyLua and has formatting
        # drift. Report the diff without failing the build.
        continue-on-error: true
        run: stylua --check Necrosis
