name: Release

on:
  push:
    tags: ["**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and release with BigWigs packager
        uses: BigWigsMods/packager@v2
        # No -g flags: the addon ships per-flavor .toc files (Necrosis.toc,
        # Necrosis_Vanilla.toc, Necrosis_TBC.toc, Necrosis_Wrath.toc,
        # Necrosis_Cata.toc, Necrosis_MOP.toc, plus retail), so the packager
        # auto-detects every supported game version. Passing -g with a game
        # type more than once (or an invalid type) makes it print usage & exit 1.
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and add these secrets to publish to CurseForge/Wago:
          # CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
